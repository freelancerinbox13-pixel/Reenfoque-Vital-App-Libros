<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lector Pro · Telegram</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#fff;--fg:#252525;--card:#f3f5f8;
 --accent:#2481cc;--line:#d9dee7;--muted:#697386;
 --paper:#fff
}
:root[data-theme="night"]{
 --bg:#121418;--fg:#e9edf3;--card:#1d222a;
 --line:#343b47;--muted:#a4adba;--paper:#181a1e
}
:root[data-theme="ebook"]{
 --bg:#f3ead5;--fg:#382d24;--card:#e9dec5;
 --line:#d4c5a5;--muted:#75624d;--paper:#f3ead5
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 background:var(--bg);color:var(--fg);overflow:hidden
}
button,select,input,textarea{font:inherit}
button{
 border:0;border-radius:10px;background:var(--accent);
 color:white;padding:9px 12px;cursor:pointer
}
button:disabled{opacity:.4}
button.secondary{
 background:var(--card);color:var(--fg);
 border:1px solid var(--line)
}
button.danger{background:#b42318}
.app{
 height:100%;height:100dvh;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top);
 padding-bottom:env(safe-area-inset-bottom)
}
header{
 display:flex;align-items:center;justify-content:space-between;
 gap:8px;padding:9px 12px;background:var(--card);
 border-bottom:1px solid var(--line)
}
header h1{font-size:17px;margin:0}
.nav{display:flex;gap:5px}
.nav button{padding:8px}
main{flex:1;min-height:0;position:relative}
.section{display:none;height:100%;overflow:auto;padding:14px}
.section.active{display:block}
.toolbar{
 display:flex;gap:8px;align-items:center;flex-wrap:wrap;
 margin-bottom:12px
}
.toolbar input,.toolbar select{
 background:var(--card);color:var(--fg);
 border:1px solid var(--line);border-radius:8px;
 padding:9px;min-width:0
}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
 gap:12px
}
.book{
 background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:12px;min-height:145px;
 cursor:pointer;overflow-wrap:anywhere;text-align:left;color:var(--fg)
}
.cover{font-size:40px;display:grid;place-items:center;height:70px}
.book h3{font-size:14px;margin:8px 0 4px}
.muted{color:var(--muted);font-size:13px}
.empty{
 padding:18px;border:1px dashed var(--line);
 border-radius:12px;color:var(--muted);overflow-wrap:anywhere
}
#readerSection{
 padding:0;display:none;flex-direction:column;overflow:hidden
}
#readerSection.active{display:flex}
.reader-tools{
 padding:7px;display:flex;gap:5px;align-items:center;
 flex-wrap:wrap;background:var(--card);
 border-bottom:1px solid var(--line)
}
.reader-tools select{
 max-width:108px;background:var(--card);color:var(--fg);
 border:1px solid var(--line);border-radius:8px;padding:8px
}
#readerTitle{
 font-size:12px;max-width:27vw;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap
}
#viewerContainer{
 position:relative;flex:1;min-height:0;overflow:auto;
 background:var(--paper);overscroll-behavior:contain;
 -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y
}
#viewer{
 position:relative;min-height:100%;width:100%;
 background:var(--paper)
}
#viewer .epub-container{background:var(--paper)!important}
#viewer iframe{border:0}
.pdf-page{
 position:relative;margin:12px auto;background:var(--paper);
 box-shadow:0 3px 12px #0002;line-height:0;flex-shrink:0;
 overflow:hidden
}
.pdf-page canvas{display:block;max-width:none}
.pdf-paper-tint{
 position:absolute;inset:0;z-index:1;
 pointer-events:none;display:none;
 background:rgba(243,234,213,.78);
 mix-blend-mode:multiply
}
.pdf-highlight-layer{
 position:absolute;inset:0;z-index:2;
 pointer-events:none;overflow:hidden
}
.pdf-highlight-rect{
 position:absolute;border-radius:2px;
 opacity:.48;pointer-events:none;
 mix-blend-mode:multiply
}
.textLayer{
 position:absolute;inset:0;z-index:3;overflow:hidden;
 line-height:1;user-select:text;-webkit-user-select:text;
 pointer-events:auto
}
.textLayer span{
 position:absolute;white-space:pre;color:transparent;
 transform-origin:0 0;cursor:text
}
.textLayer ::selection{background:rgba(255,210,80,.4)}
.reader-bottom{
 display:flex;justify-content:space-between;align-items:center;
 gap:8px;padding:8px 10px;background:var(--card);
 border-top:1px solid var(--line)
}
#status{
 padding:7px 12px;font-size:12px;color:var(--muted);
 display:none;background:var(--card);overflow-wrap:anywhere
}
#selectionMenu{
 display:none;position:fixed;z-index:99;gap:5px;padding:7px;
 background:#242932;color:white;border-radius:11px;
 box-shadow:0 6px 24px #0004;max-width:calc(100vw - 12px);
 max-height:40dvh;overflow:auto;flex-wrap:wrap;touch-action:pan-y
}
#selectionMenu button{
 font-size:12px;padding:8px;background:#3a414d;
 color:white;white-space:nowrap
}
#selectionMenu select{
 font-size:12px;max-width:95px;padding:7px;
 border:1px solid #626b78;border-radius:7px;
 background:#303640;color:white
}
#highlightSelection{background:#e8d98a!important;color:#302a17!important}
.note{
 padding:12px;margin-bottom:10px;background:var(--card);
 border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere
}
.note-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.note p{white-space:pre-wrap;margin:8px 0}
.small{font-size:12px}
.dialog-backdrop{
 position:fixed;inset:0;background:#0007;display:none;
 align-items:center;justify-content:center;padding:18px;z-index:120
}
.dialog{
 background:var(--bg);color:var(--fg);border:1px solid var(--line);
 border-radius:14px;padding:16px;width:min(520px,100%);
 max-height:85dvh;overflow:auto
}
.dialog textarea{
 width:100%;min-height:110px;background:var(--card);
 color:var(--fg);border:1px solid var(--line);
 border-radius:8px;padding:10px
}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(min-width:760px){
 .section{padding:22px}
 .reader-tools{padding:10px 14px}
}
</style>
</head>

<body>
<div class="app">
<header>
 <h1 id="appTitle">📚 Biblioteca</h1>
 <nav class="nav">
  <button id="navLibrary" class="secondary">Libros</button>
  <button id="navNotes" class="secondary">Notas</button>
 </nav>
</header>

<div id="status" role="status"></div>

<main>
<section id="librarySection" class="section active">
 <div class="toolbar">
  <input id="searchBooks" type="search" placeholder="Buscar un libro…" aria-label="Buscar libros">
  <button id="reloadBooks" class="secondary">Actualizar</button>
 </div>
 <div id="bookList" class="grid">
  <p class="empty">Conectando con la biblioteca…</p>
 </div>
</section>

<section id="readerSection" class="section">
 <div class="reader-tools">
  <button id="backLibrary" class="secondary">← Biblioteca</button>
  <strong id="readerTitle">Lector</strong>
  <select id="themeSelect" aria-label="Tema">
   <option value="day">Día</option>
   <option value="night">Noche</option>
   <option value="ebook">E-book</option>
  </select>
  <button id="zoomOut" class="secondary" aria-label="Reducir letra">A−</button>
  <span id="zoomLabel" class="small">100%</span>
  <button id="zoomIn" class="secondary" aria-label="Aumentar letra">A+</button>
 </div>

 <div id="viewerContainer"><div id="viewer"></div></div>

 <div class="reader-bottom">
  <button id="prevPage" class="secondary">Anterior</button>
  <span id="progress" class="muted">Preparando…</span>
  <button id="nextPage">Siguiente</button>
 </div>
</section>

<section id="notesSection" class="section">
 <h2>Notas y resaltados</h2>
 <p class="muted">Las anotaciones se guardan en este dispositivo.</p>
 <div class="toolbar">
  <input id="searchNotes" type="search" placeholder="Buscar notas…">
  <button id="exportNotes" class="secondary">Exportar JSON</button>
 </div>
 <div id="notesList"></div>
</section>
</main>
</div>

<div id="selectionMenu">
 <select id="highlightColor" aria-label="Color del resaltado">
  <option value="#f6df72">Amarillo suave</option>
  <option value="#b9e8c5">Verde suave</option>
  <option value="#b9dcf8">Azul suave</option>
  <option value="#f4c4d8">Rosa suave</option>
  <option value="#f5d0a6">Naranja suave</option>
  <option value="#d8c8f4">Violeta suave</option>
 </select>
 <button id="highlightSelection">Resaltar</button>
 <button id="noteSelection">Añadir nota</button>
 <button id="closeSelection">✕</button>
</div>

<div id="dialogBackdrop" class="dialog-backdrop">
 <div class="dialog" role="dialog" aria-modal="true">
  <h2 id="dialogTitle">Anotación</h2>
  <p id="dialogOriginal" class="muted"></p>
  <textarea id="dialogText" placeholder="Escribe una nota…"></textarea>
  <div class="dialog-actions">
   <button id="dialogCancel" class="secondary">Cancelar</button>
   <button id="dialogSave">Guardar</button>
  </div>
 </div>
</div>

<script>
(() => {
'use strict';

const tg=window.Telegram?.WebApp;
try{tg?.ready();tg?.expand()}catch(_){}

const CONFIG={
 supabaseUrl:'https://augjyfnnzserfdoekkrp.supabase.co',
 supabaseAnonKey:'sb_publishable_ed7WzU7SyteyxrAk5qE44w_N2vslpMU'
};

const $=id=>document.getElementById(id);
const NOTES_KEY='reader_pro_notes_v1';
const THEME_KEY='reader_pro_theme';
const PROGRESS_PREFIX='reader_pro_progress_';

const state={
 supabase:null,books:[],currentBook:null,format:null,
 book:null,rendition:null,pdf:null,page:1,scale:1,
 selectedText:'',selectedAnchor:null,notes:[],
 loadToken:0,pendingAction:null,locationsReady:false,
 pdfRenderToken:0
};

function status(message,show=true){
 $('status').textContent=message;
 $('status').style.display=show?'block':'none';
}

function makeId(){
 return window.crypto?.randomUUID?.()||
  `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function getBookId(book){
 return String(book?.id??book?.url_archivo??book?.titulo??'unknown');
}

function fileFormat(book){
 const f=String(book.formato||book.format||book.tipo_archivo||book.mime_type||'').toLowerCase();
 const url=String(book.url_archivo||book.url||'');
 if(f.includes('pdf')||/\.pdf(?:$|[?#])/i.test(url))return'pdf';
 if(f.includes('epub')||/\.epub(?:$|[?#])/i.test(url))return'epub';
 return'';
}

function safeUrl(url){
 try{
  const u=new URL(url,location.href);
  return['https:','http:'].includes(u.protocol)?u.href:'';
 }catch(_){return''}
}

function loadNotes(){
 try{
  const n=JSON.parse(localStorage.getItem(NOTES_KEY)||'[]');
  state.notes=Array.isArray(n)?n:[];
 }catch(_){state.notes=[]}
}

function saveNotes(){
 try{localStorage.setItem(NOTES_KEY,JSON.stringify(state.notes))}
 catch(_){status('No se pudieron guardar las notas en este dispositivo.')}
}

function setSection(id){
 ['librarySection','readerSection','notesSection'].forEach(x=>$(x).classList.remove('active'));
 $(id).classList.add('active');
 $('appTitle').textContent=id==='librarySection'?'📚 Biblioteca':id==='readerSection'?'📖 Lector':'📝 Mis anotaciones';
 hideSelectionMenu();
 if(id==='notesSection')renderNotes();
 if(id==='readerSection')setTimeout(resizeReader,100);
}

function addBookCard(book){
 const card=document.createElement('button');
 card.className='book';card.type='button';
 const cover=document.createElement('div');
 cover.className='cover';cover.textContent='📖';
 const title=document.createElement('h3');
 title.textContent=book.titulo||'Sin título';
 const format=document.createElement('p');
 format.className='muted';
 format.textContent=fileFormat(book).toUpperCase()||'Formato no indicado';
 card.append(cover,title,format);
 card.addEventListener('click',()=>openBook(book));
 $('bookList').append(card);
}

async function loadBooks(){
 const list=$('bookList');list.replaceChildren();
 const p=document.createElement('p');p.className='empty';
 p.textContent='Cargando biblioteca…';list.append(p);
 if(!state.supabase){
  p.textContent='No se pudo inicializar Supabase. Revisa la configuración.';
  return;
 }
 try{
  const {data,error}=await state.supabase.from('libros').select('*').order('titulo',{ascending:true});
  if(error)throw error;
  state.books=Array.isArray(data)?data:[];
  renderBooks();
  status(`${state.books.length} libro(s) cargados.`,true);
 }catch(e){
  p.textContent=`Error al cargar la biblioteca: ${e.message||'error desconocido'}`;
  status('Error de Supabase.');
 }
}

function renderBooks(){
 const list=$('bookList');list.replaceChildren();
 const q=$('searchBooks').value.trim().toLocaleLowerCase();
 const filtered=state.books.filter(b=>String(b.titulo||'').toLocaleLowerCase().includes(q));
 if(!filtered.length){
  const p=document.createElement('p');p.className='empty';
  p.textContent='No hay libros que coincidan con la búsqueda.';
  list.append(p);return;
 }
 filtered.forEach(addBookCard);
}

function themeColors(){
 const theme=document.documentElement.dataset.theme||'day';
 if(theme==='night')return{bg:'#181a1e',fg:'#e9edf3',link:'#9bcfff'};
 if(theme==='ebook')return{bg:'#f3ead5',fg:'#382d24',link:'#81552d'};
 return{bg:'#ffffff',fg:'#252525',link:'#1769aa'};
}

function setTheme(theme){
 if(!['day','night','ebook'].includes(theme))theme='day';
 document.documentElement.dataset.theme=theme;
 $('themeSelect').value=theme;
 try{localStorage.setItem(THEME_KEY,theme)}catch(_){}
 applyReaderTheme();
 if(state.format==='pdf'&&state.pdf){
  renderPdfPage(state.page).catch(e=>console.warn('No se pudo actualizar el tema PDF:',e));
 }
}

function applyReaderTheme(){
 const p=themeColors();
 const theme=document.documentElement.dataset.theme||'day';

 if(state.rendition){
  try{
   state.rendition.themes.default({
    html:{background:p.bg,color:p.fg},
    body:{background:p.bg,color:p.fg},
    'p, div, span, li, h1, h2, h3, h4, h5, h6, blockquote':{color:p.fg},
    a:{color:p.link}
   });

   const contents=state.rendition.getContents?.()||[];
   contents.forEach(c=>{
    const doc=c.document;
    if(!doc)return;
    let style=doc.getElementById('reader-theme-fix');
    if(!style){
     style=doc.createElement('style');
     style.id='reader-theme-fix';
     (doc.head||doc.documentElement).appendChild(style);
    }

    style.textContent=`
     html,body{
       background:${p.bg}!important;
       color:${p.fg}!important;
       color-scheme:light!important;
     }
     body{margin:0!important;padding:0!important}
     body *{color:${p.fg}}
     a,a *{color:${p.link}!important}
     img,svg,canvas{background:transparent}
     ::selection{background:rgba(150,190,230,.4)}
    `;

    doc.documentElement.style.setProperty('background-color',p.bg,'important');
    if(doc.body)doc.body.style.setProperty('background-color',p.bg,'important');
   });
  }catch(e){console.warn('Tema EPUB:',e)}
 }

 document.querySelectorAll('.pdf-page').forEach(el=>{
  el.style.backgroundColor=p.bg;
 });

 document.querySelectorAll('.pdf-page canvas').forEach(el=>{
  if(theme==='night'){
   el.style.filter='invert(.88) hue-rotate(180deg)';
  }else if(theme==='ebook'){
   // Tinte moderado en el lienzo; la capa crema de encima hace el fondo más cálido.
   el.style.filter='sepia(.25) saturate(.82) brightness(1.01)';
  }else{
   el.style.filter='none';
  }
 });

 document.querySelectorAll('.pdf-paper-tint').forEach(el=>{
  el.style.display=theme==='ebook'?'block':'none';
  el.style.background=theme==='ebook'?'rgba(243,234,213,.78)':'transparent';
  el.style.mixBlendMode=theme==='ebook'?'multiply':'normal';
 });
}

async function closeCurrentDocument(){
 state.loadToken++;
 state.pdfRenderToken++;
 try{state.rendition?.destroy()}catch(_){}
 try{state.book?.destroy()}catch(_){}
 try{await state.pdf?.destroy()}catch(_){}
 state.rendition=null;state.book=null;state.pdf=null;
 state.currentBook=null;state.format=null;
 state.locationsReady=false;state.selectedAnchor=null;state.selectedText='';
 $('viewer').replaceChildren();
 $('viewer').style.width='100%';
 $('viewer').style.height='100%';
 hideSelectionMenu();
}

async function openBook(book){
 const url=safeUrl(book.url_archivo||book.url);
 const format=fileFormat(book);
 if(!url){alert('Este libro no tiene una URL válida en url_archivo.');return}
 if(!format){alert('No se reconoce el formato. Comprueba formato y url_archivo en Supabase.');return}

 await closeCurrentDocument();
 const token=state.loadToken;
 state.currentBook=book;state.format=format;state.scale=1;
 state.locationsReady=false;
 $('zoomLabel').textContent='100%';
 $('readerTitle').textContent=book.titulo||'Libro';
 $('progress').textContent='Cargando documento…';
 $('viewer').replaceChildren();
 $('viewerContainer').scrollTop=0;
 $('viewerContainer').scrollLeft=0;
 setSection('readerSection');
 status('Abriendo documento…');

 try{
  if(format==='epub')await loadEpub(url,token);
  else await loadPdf(url,token);
  if(token===state.loadToken)status('',false);
 }catch(e){
  if(token!==state.loadToken)return;
  console.error('Error abriendo libro:',e);
  $('viewer').replaceChildren();
  const p=document.createElement('p');p.className='empty';
  p.textContent=`No se pudo abrir: ${e.message||'error desconocido'}`;
  $('viewer').append(p);
  $('progress').textContent='Error de carga';
  status('El documento no se pudo mostrar. Lee el detalle que aparece en el visor.');
 }
}

function loadScript(url){
 return new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src=url;s.async=true;
  const timer=setTimeout(()=>{
   s.remove();reject(new Error('Tiempo agotado cargando '+url));
  },15000);
  s.onload=()=>{clearTimeout(timer);resolve()};
  s.onerror=()=>{
   clearTimeout(timer);s.remove();
   reject(new Error('No se pudo cargar '+url));
  };
  document.head.appendChild(s);
 });
}

async function loadLibraryWithFallback(name,urls){
 if(window[name])return window[name];
 const errors=[];
 for(const url of urls){
  try{
   await loadScript(url);
   if(window[name])return window[name];
   errors.push(url+' no creó '+name);
  }catch(e){errors.push(e.message)}
 }
 throw new Error(`No se pudo cargar ${name}. ${errors.join(' | ')}`);
}

async function ensureEpubLibraries(){
 await loadLibraryWithFallback('JSZip',[
  'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
 ]);
 await loadLibraryWithFallback('ePub',[
  'https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js',
  'https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js',
  'https://unpkg.com/epubjs@0.3.93/dist/epub.min.js'
 ]);
}

async function loadEpub(url,token){
 await ensureEpubLibraries();
 if(typeof window.ePub!=='function')throw new Error('EPUB.js no está disponible.');

 let response;
 try{
  response=await fetch(url,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store'});
 }catch(e){
  throw new Error(`No se pudo descargar el EPUB: ${e.message||e}`);
 }

 if(!response.ok)throw new Error(`Supabase respondió HTTP ${response.status}.`);
 const bytes=await response.arrayBuffer();
 if(token!==state.loadToken)return;
 if(bytes.byteLength<100)throw new Error('El archivo está vacío o incompleto.');

 const signature=new Uint8Array(bytes.slice(0,2));
 if(signature[0]!==0x50||signature[1]!==0x4b){
  throw new Error('La URL no devuelve un archivo EPUB ZIP válido.');
 }

 try{
  const zip=await window.JSZip.loadAsync(bytes.slice(0));
  if(!zip.file('META-INF/container.xml'))throw new Error('Falta META-INF/container.xml');
 }catch(e){
  throw new Error(`No se puede leer el EPUB: ${e.message||e}`);
 }

 if(token!==state.loadToken)return;

 const w=Math.max(280,$('viewerContainer').clientWidth);
 const h=Math.max(300,$('viewerContainer').clientHeight);
 $('viewer').style.width=`${w}px`;
 $('viewer').style.height=`${h}px`;

 state.book=window.ePub(bytes);
 state.rendition=state.book.renderTo('viewer',{
  width:w,height:h,flow:'paginated',spread:'none',manager:'default'
 });

 state.rendition.on('displayError',error=>{
  console.error('EPUB displayError:',error);
  status(`Error mostrando el capítulo: ${error?.message||error||'error de renderizado'}`);
 });

 state.rendition.on('rendered',()=>{
  applyReaderTheme();
  restoreEpubHighlights();
 });

 state.rendition.on('selected',(cfi,contents)=>{
  const selection=contents?.window?.getSelection?.();
  const text=selection?.toString()?.trim()||'';
  if(!text||!cfi)return;
  state.selectedText=text;
  state.selectedAnchor={kind:'epub',cfi};
  try{
   const rect=selection.getRangeAt(0).getBoundingClientRect();
   const frame=contents.document.defaultView.frameElement;
   const fr=frame?.getBoundingClientRect();
   showSelectionMenu((fr?.left||0)+rect.left,(fr?.top||0)+rect.bottom+8);
  }catch(_){showSelectionMenu(10,80)}
 });

 state.rendition.on('relocated',loc=>{
  if(token!==state.loadToken)return;
  $('prevPage').disabled=!!loc?.atStart;
  $('nextPage').disabled=!!loc?.atEnd;
  const cfi=loc?.start?.cfi;

  if(cfi){
   try{localStorage.setItem(PROGRESS_PREFIX+getBookId(state.currentBook),cfi)}catch(_){}
   if(state.locationsReady){
    const pct=state.book.locations.percentageFromCfi(cfi);
    $('progress').textContent=`${Math.round((Number.isFinite(pct)?pct:0)*100)}%`;
   }else $('progress').textContent='Leyendo EPUB…';
  }
 });

 let saved=null;
 try{saved=localStorage.getItem(PROGRESS_PREFIX+getBookId(state.currentBook))}catch(_){}

 await state.book.ready;
 if(token!==state.loadToken)return;

 const metadata=state.book.package?.metadata;
 if(metadata?.title)$('readerTitle').textContent=metadata.title;

 await state.rendition.display(saved||undefined);
 if(token!==state.loadToken)return;

 applyReaderTheme();
 resizeReader();

 try{
  await state.book.locations.generate(1000);
  if(token===state.loadToken){
   state.locationsReady=true;
   const loc=state.rendition.currentLocation();
   const pct=loc?.start?.cfi?state.book.locations.percentageFromCfi(loc.start.cfi):0;
   $('progress').textContent=`${Math.round((Number.isFinite(pct)?pct:0)*100)}%`;
  }
 }catch(e){
  console.warn('No se pudieron calcular ubicaciones EPUB:',e);
  $('progress').textContent='EPUB abierto';
 }
 restoreEpubHighlights();
}

function resizeReader(){
 if(state.format==='epub'&&state.rendition){
  const w=Math.max(280,$('viewerContainer').clientWidth);
  const h=Math.max(300,$('viewerContainer').clientHeight);
  $('viewer').style.width=`${w}px`;
  $('viewer').style.height=`${h}px`;
  try{state.rendition.resize(w,h)}catch(e){console.warn('Resize EPUB:',e)}
 }
}

async function setEpubZoom(){
 if(state.format!=='epub'||!state.rendition)return;

 const rendition=state.rendition;
 let currentCfi=null;
 try{
  const loc=rendition.currentLocation();
  currentCfi=loc?.start?.cfi||null;
 }catch(_){}

 const percentage=`${Math.round(state.scale*100)}%`;
 try{
  rendition.themes.fontSize(percentage);
 }catch(e){
  console.warn('No se pudo cambiar el tamaño EPUB:',e);
 }

 // Esperar a que el contenido reajuste su maquetación antes de recuperar la posición.
 await new Promise(resolve=>setTimeout(resolve,180));

 if(rendition!==state.rendition)return;

 const w=Math.max(280,$('viewerContainer').clientWidth);
 const h=Math.max(300,$('viewerContainer').clientHeight);
 $('viewer').style.width=`${w}px`;
 $('viewer').style.height=`${h}px`;

 try{rendition.resize(w,h)}catch(e){console.warn('Resize EPUB:',e)}

 await new Promise(resolve=>setTimeout(resolve,120));

 if(rendition!==state.rendition)return;

 if(currentCfi){
  try{await rendition.display(currentCfi)}catch(e){console.warn('No se pudo recuperar la posición EPUB:',e)}
 }

 applyReaderTheme();
 restoreEpubHighlights();
}

async function loadPdf(url,token){
 if(!window.pdfjsLib)throw new Error('PDF.js no se ha cargado.');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

 try{
  state.pdf=await pdfjsLib.getDocument({url,withCredentials:false}).promise;
 }catch(first){
  let response;
  try{response=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store'})}
  catch(e){throw new Error(`No se pudo descargar el PDF: ${e.message||e}`)}
  if(!response.ok)throw new Error(`Supabase respondió HTTP ${response.status}.`);
  const data=await response.arrayBuffer();
  const sig=new TextDecoder('ascii').decode(data.slice(0,5));
  if(sig!=='%PDF-')throw new Error('El archivo descargado no parece un PDF.');
  state.pdf=await pdfjsLib.getDocument({data:new Uint8Array(data)}).promise;
 }

 if(token!==state.loadToken)return;
 if(!state.pdf?.numPages)throw new Error('El PDF no contiene páginas legibles.');

 let saved=1;
 try{saved=Number(localStorage.getItem(PROGRESS_PREFIX+getBookId(state.currentBook))||1)}catch(_){}
 state.page=Math.max(1,Math.min(state.pdf.numPages,Number.isFinite(saved)?saved:1));
 await renderPdfPage(state.page,token);
}

async function renderPdfPage(num,token=state.loadToken){
 if(!state.pdf)return;

 const renderToken=++state.pdfRenderToken;
 num=Math.max(1,Math.min(state.pdf.numPages,Math.floor(num)));
 state.page=num;
 $('prevPage').disabled=num<=1;
 $('nextPage').disabled=num>=state.pdf.numPages;
 $('progress').textContent=`Página ${num} de ${state.pdf.numPages}`;

 const page=await state.pdf.getPage(num);
 if(token!==state.loadToken||renderToken!==state.pdfRenderToken)return;

 const container=$('viewer');
 container.replaceChildren();

 const base=page.getViewport({scale:1});
 const available=Math.max(260,$('viewerContainer').clientWidth-24);
 const fitScale=Math.min(1.5,available/base.width);
 const scale=fitScale*state.scale;
 const viewport=page.getViewport({scale});

 const wrapper=document.createElement('div');
 wrapper.className='pdf-page';
 wrapper.style.width=`${viewport.width}px`;
 wrapper.style.height=`${viewport.height}px`;

 const canvas=document.createElement('canvas');
 const ctx=canvas.getContext('2d',{alpha:false});
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.floor(viewport.width*dpr);
 canvas.height=Math.floor(viewport.height*dpr);
 canvas.style.width=`${viewport.width}px`;
 canvas.style.height=`${viewport.height}px`;

 // Capa de color para que el fondo blanco del propio PDF se vea crema.
 const tint=document.createElement('div');
 tint.className='pdf-paper-tint';

 // Las marcas se dibujan encima del lienzo y debajo de la capa de selección.
 const highlightLayer=document.createElement('div');
 highlightLayer.className='pdf-highlight-layer';
 highlightLayer.style.width=`${viewport.width}px`;
 highlightLayer.style.height=`${viewport.height}px`;

 const layer=document.createElement('div');
 layer.className='textLayer';
 layer.style.width=`${viewport.width}px`;
 layer.style.height=`${viewport.height}px`;

 wrapper.append(canvas,tint,highlightLayer,layer);
 container.append(wrapper);

 container.style.overflow='auto';
 container.style.webkitOverflowScrolling='touch';

 await page.render({
  canvasContext:ctx,viewport,
  transform:dpr===1?null:[dpr,0,0,dpr,0,0]
 }).promise;

 if(token!==state.loadToken||renderToken!==state.pdfRenderToken)return;

 const textContent=await page.getTextContent();
 if(typeof pdfjsLib.renderTextLayer==='function'){
  const task=pdfjsLib.renderTextLayer({
   textContent,container:layer,viewport,textDivs:[]
  });
  if(task?.promise)await task.promise;
 }

 if(token!==state.loadToken||renderToken!==state.pdfRenderToken)return;

 try{localStorage.setItem(PROGRESS_PREFIX+getBookId(state.currentBook),String(num))}catch(_){}

 applyReaderTheme();
 restorePdfHighlights(num);
}

function safeHighlightColor(color){
 return /^#[0-9a-f]{6}$/i.test(String(color||''))?color:'#f6df72';
}

function restorePdfHighlights(pageNumber=state.page){
 if(!state.currentBook||state.format!=='pdf')return;

 const wrapper=$('viewer').querySelector('.pdf-page');
 const layer=wrapper?.querySelector('.pdf-highlight-layer');
 if(!wrapper||!layer)return;

 layer.replaceChildren();

 const id=getBookId(state.currentBook);
 const notes=state.notes.filter(n=>
  n.bookId===id&&
  n.type==='Resaltado'&&
  n.anchor?.kind==='pdf'&&
  Number(n.anchor.page)===Number(pageNumber)&&
  Array.isArray(n.anchor.rects)
 );

 notes.forEach(note=>{
  const color=safeHighlightColor(note.color);
  note.anchor.rects.forEach(rect=>{
   if(!rect||![rect.x,rect.y,rect.w,rect.h].every(Number.isFinite))return;

   const mark=document.createElement('div');
   mark.className='pdf-highlight-rect';
   mark.style.backgroundColor=color;
   mark.style.left=`${rect.x*100}%`;
   mark.style.top=`${rect.y*100}%`;
   mark.style.width=`${Math.max(0,rect.w*100)}%`;
   mark.style.height=`${Math.max(0,rect.h*100)}%`;
   layer.append(mark);
  });
 });
}

function getPdfSelectionAnchor(range,text){
 const wrapper=$('viewer').querySelector('.pdf-page');
 if(!wrapper||!range)return{kind:'pdf',page:state.page,quote:text,rects:[]};

 const bounds=wrapper.getBoundingClientRect();
 if(!bounds.width||!bounds.height)return{kind:'pdf',page:state.page,quote:text,rects:[]};

 const rects=[...range.getClientRects()]
  .filter(r=>r.width>0&&r.height>0)
  .map(r=>{
   const left=Math.max(r.left,bounds.left);
   const top=Math.max(r.top,bounds.top);
   const right=Math.min(r.right,bounds.right);
   const bottom=Math.min(r.bottom,bounds.bottom);

   if(right<=left||bottom<=top)return null;

   return{
    x:(left-bounds.left)/bounds.width,
    y:(top-bounds.top)/bounds.height,
    w:(right-left)/bounds.width,
    h:(bottom-top)/bounds.height
   };
  })
  .filter(Boolean);

 return{kind:'pdf',page:state.page,quote:text,rects};
}

function showSelectionMenu(x,y){
 const menu=$('selectionMenu');
 menu.style.display='flex';
 requestAnimationFrame(()=>{
  const w=menu.offsetWidth||280,h=menu.offsetHeight||50;
  menu.style.left=`${Math.max(6,Math.min(window.innerWidth-w-6,x))}px`;
  menu.style.top=`${Math.max(6,Math.min(window.innerHeight-h-6,y))}px`;
 });
}

function hideSelectionMenu(){
 $('selectionMenu').style.display='none';
}

document.addEventListener('selectionchange',()=>{
 if(state.format!=='pdf')return;

 const sel=window.getSelection();
 const text=sel?.toString()?.trim();
 if(!text)return;

 const node=sel.anchorNode;
 if(!node||!$('viewer').contains(node))return;

 const range=sel.getRangeAt(0);
 state.selectedText=text;
 state.selectedAnchor=getPdfSelectionAnchor(range,text);

 const rect=range.getBoundingClientRect();
 showSelectionMenu(rect.left,rect.bottom+8);
});

function applyEpubHighlight(cfi,color){
 if(!state.rendition||!cfi)return false;
 const safe=safeHighlightColor(color);

 try{
  state.rendition.annotations.highlight(
   cfi,
   {color:safe},
   ()=>{},
   'reader-highlight',
   {
    fill:safe,
    'fill-opacity':'0.30',
    'mix-blend-mode':'multiply',
    'pointer-events':'none',
    'stroke':'none'
   }
  );
  return true;
 }catch(e){
  console.error('Error aplicando resaltado EPUB:',e);
  return false;
 }
}

function restoreEpubHighlights(){
 if(!state.rendition||!state.currentBook)return;
 const id=getBookId(state.currentBook);
 state.notes
  .filter(n=>n.bookId===id&&n.type==='Resaltado'&&n.anchor?.kind==='epub'&&n.anchor.cfi)
  .forEach(n=>applyEpubHighlight(n.anchor.cfi,n.color||'#f6df72'));
}

function createNote({type,text,original='',anchor=state.selectedAnchor,color=null}){
 state.notes.unshift({
  id:makeId(),
  bookId:getBookId(state.currentBook),
  bookTitle:state.currentBook?.titulo||'Libro',
  type,text,original,anchor,color,
  createdAt:new Date().toISOString()
 });
 saveNotes();
 hideSelectionMenu();
 renderNotes();
}

$('highlightSelection').addEventListener('click',()=>{
 if(!state.selectedText||!state.currentBook){
  alert('Selecciona primero una palabra o un fragmento del libro.');
  return;
 }

 const anchor=state.selectedAnchor?{...state.selectedAnchor}: {kind:state.format};
 const color=safeHighlightColor($('highlightColor').value);

 if(state.format==='epub'){
  if(!anchor.cfi){
   alert('No se pudo identificar el fragmento. Selecciona el texto de nuevo.');
   return;
  }
  if(!applyEpubHighlight(anchor.cfi,color)){
   alert('No se pudo resaltar el texto. Prueba a seleccionar otra vez.');
   return;
  }
 }else if(state.format==='pdf'){
  if(!Array.isArray(anchor.rects)||anchor.rects.length===0){
   alert('No se pudieron obtener las coordenadas del texto. Selecciónalo de nuevo e inténtalo otra vez.');
   return;
  }
 }

 createNote({type:'Resaltado',text:state.selectedText,anchor,color});

 if(state.format==='pdf')restorePdfHighlights(state.page);

 try{
  (state.rendition?.getContents?.()||[]).forEach(c=>c.window?.getSelection?.().removeAllRanges());
 }catch(_){}
 try{window.getSelection()?.removeAllRanges()}catch(_){}

 state.selectedText='';
 state.selectedAnchor=null;
});

$('noteSelection').addEventListener('click',()=>{
 if(!state.selectedText||!state.currentBook){
  alert('Selecciona primero un fragmento de texto.');
  return;
 }
 const selected=state.selectedText;
 const anchor=state.selectedAnchor?JSON.parse(JSON.stringify(state.selectedAnchor)):null;

 openDialog('Nota',selected,'',value=>{
  createNote({type:'Nota',text:value,original:selected,anchor});
 });
});

function openDialog(title,original,value,onSave){
 state.pendingAction=onSave;
 $('dialogTitle').textContent=title;
 $('dialogOriginal').textContent=original||'';
 $('dialogText').value=value||'';
 $('dialogBackdrop').style.display='flex';
 $('dialogText').focus();
}

function closeDialog(){
 $('dialogBackdrop').style.display='none';
 state.pendingAction=null;
}

$('dialogCancel').addEventListener('click',closeDialog);
$('dialogBackdrop').addEventListener('click',e=>{
 if(e.target===$('dialogBackdrop'))closeDialog();
});

$('dialogSave').addEventListener('click',()=>{
 const cb=state.pendingAction,value=$('dialogText').value.trim();
 if(!value){$('dialogText').focus();return}
 closeDialog();
 if(cb)cb(value);
});

$('closeSelection').addEventListener('click',hideSelectionMenu);

document.addEventListener('pointerdown',e=>{
 if(!$('selectionMenu').contains(e.target)&&
    !window.getSelection()?.toString()?.trim()&&
    !state.selectedText){
  hideSelectionMenu();
 }
});

$('prevPage').addEventListener('click',async()=>{
 hideSelectionMenu();
 try{
  if(state.format==='epub'&&state.rendition)await state.rendition.prev();
  else if(state.format==='pdf'&&state.pdf&&state.page>1)await renderPdfPage(state.page-1);
 }catch(e){status(`No se pudo ir a la página anterior: ${e.message||e}`)}
});

$('nextPage').addEventListener('click',async()=>{
 hideSelectionMenu();
 try{
  if(state.format==='epub'&&state.rendition)await state.rendition.next();
  else if(state.format==='pdf'&&state.pdf&&state.page<state.pdf.numPages)await renderPdfPage(state.page+1);
 }catch(e){status(`No se pudo avanzar: ${e.message||e}`)}
});

async function changeZoom(direction){
 const next=state.scale+direction;
 state.scale=Math.max(.6,Math.min(3,Math.round(next*10)/10));
 $('zoomLabel').textContent=`${Math.round(state.scale*100)}%`;

 if(state.format==='pdf'&&state.pdf){
  const container=$('viewerContainer');
  const oldLeft=container.scrollLeft;
  const oldTop=container.scrollTop;
  await renderPdfPage(state.page);
  container.scrollLeft=oldLeft;
  container.scrollTop=oldTop;
 }else if(state.format==='epub'&&state.rendition){
  await setEpubZoom();
 }
}

$('zoomIn').addEventListener('click',()=>changeZoom(.2));
$('zoomOut').addEventListener('click',()=>changeZoom(-.2));

$('themeSelect').addEventListener('change',e=>setTheme(e.target.value));
$('navLibrary').addEventListener('click',()=>setSection('librarySection'));
$('navNotes').addEventListener('click',()=>setSection('notesSection'));

$('backLibrary').addEventListener('click',async()=>{
 await closeCurrentDocument();
 setSection('librarySection');
});

$('reloadBooks').addEventListener('click',loadBooks);
$('searchBooks').addEventListener('input',renderBooks);
$('searchNotes').addEventListener('input',renderNotes);

function renderNotes(){
 const list=$('notesList');list.replaceChildren();
 const q=$('searchNotes').value.trim().toLocaleLowerCase();
 const items=state.notes.filter(n=>
  [n.bookTitle,n.type,n.text,n.original].join(' ').toLocaleLowerCase().includes(q)
 );

 if(!items.length){
  const p=document.createElement('p');p.className='empty';
  p.textContent='Todavía no hay anotaciones.';
  list.append(p);return;
 }

 items.forEach(n=>{
  const article=document.createElement('article');
  article.className='note';

  const head=document.createElement('div');head.className='note-head';
  const label=document.createElement('strong');
  label.textContent=`${n.type} · ${n.bookTitle||'Libro'}`;

  const del=document.createElement('button');
  del.className='danger';del.textContent='Eliminar';
  del.addEventListener('click',()=>{
   if(!confirm('¿Eliminar esta anotación?'))return;
   state.notes=state.notes.filter(x=>x.id!==n.id);
   saveNotes();
   renderNotes();
   if(state.format==='pdf'&&state.pdf)restorePdfHighlights(state.page);
  });

  head.append(label,del);
  const date=document.createElement('div');
  date.className='muted small';
  date.textContent=new Date(n.createdAt).toLocaleString();
  article.append(head,date);

  if(n.original){
   const orig=document.createElement('p');
   orig.textContent=`Texto original: ${n.original}`;
   article.append(orig);
  }

  const text=document.createElement('p');
  text.textContent=n.text;
  if(n.color)text.style.borderLeft=`5px solid ${n.color}`;
  article.append(text);
  list.append(article);
 });
}

$('exportNotes').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(state.notes,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download='mis-anotaciones.json';
 document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});

window.addEventListener('resize',()=>{
 if(state.format==='epub'){
  clearTimeout(window.__readerResizeTimer);
  window.__readerResizeTimer=setTimeout(async()=>{
   const rendition=state.rendition;
   let cfi=null;
   try{cfi=rendition?.currentLocation()?.start?.cfi||null}catch(_){}
   resizeReader();
   if(rendition&&cfi){
    setTimeout(()=>{if(rendition===state.rendition)rendition.display(cfi).catch(()=>{})},120);
   }
  },180);
 }
 if(state.format==='pdf'&&state.pdf){
  clearTimeout(window.__pdfResizeTimer);
  window.__pdfResizeTimer=setTimeout(()=>renderPdfPage(state.page),200);
 }
});

window.addEventListener('beforeunload',()=>{
 try{state.rendition?.destroy();state.book?.destroy();state.pdf?.destroy()}catch(_){}
});

loadNotes();

try{setTheme(localStorage.getItem(THEME_KEY)||'day')}
catch(_){setTheme('day')}

try{
 if(window.supabase?.createClient){
  state.supabase=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);
 }
}catch(e){console.error('Supabase:',e)}

loadBooks();
})();
</script>
