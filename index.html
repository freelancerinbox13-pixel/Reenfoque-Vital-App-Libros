<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lector Pro · Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff;--fg:#20242b;--card:#f3f5f8;--accent:#2481cc;--line:#d9dee7;--muted:#697386;--mark:#ffeb3b}
:root[data-theme="night"]{--bg:#121418;--fg:#e9edf3;--card:#1d222a;--line:#343b47;--muted:#a4adba;--mark:#d4a900}
:root[data-theme="ebook"]{--bg:#f4ecd8;--fg:#2c221e;--card:#e8dec5;--line:#d4c8aa;--muted:#6b5b4c}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
button,select,input{font:inherit}button{border:0;border-radius:10px;background:var(--accent);color:white;padding:10px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:var(--card);color:var(--fg);border:1px solid var(--line)}button.danger{background:#b42318}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}.nav{display:flex;gap:6px}.nav button{padding:8px 10px}
main{flex:1;min-height:0;position:relative}.section{display:none;height:100%;overflow:auto;padding:14px}.section.active{display:block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.toolbar input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.book{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:150px;cursor:pointer;overflow-wrap:anywhere}.cover{font-size:42px;display:grid;place-items:center;height:75px}.book h3{font-size:14px;margin:8px 0 4px}.muted{color:var(--muted);font-size:13px}.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
#readerSection{padding:0;display:none;flex-direction:column;overflow:hidden}#readerSection.active{display:flex}
.reader-tools{padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}.reader-tools select{max-width:130px}
#readerTitle{font-size:13px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewerContainer{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;background:var(--bg);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#viewer{height:auto;min-height:100%;width:100%;max-width:100%;min-width:0;display:block;overflow:visible}
/* EPUB en lectura fluida: el contenido se desplaza verticalmente y se ajusta al móvil */
#viewer .epub-container{width:100%!important;max-width:100%!important;height:auto!important;min-height:100%!important;margin:0!important;overflow:visible!important}
#viewer .epub-view{width:100%!important;max-width:100%!important;overflow:visible!important}
#viewer iframe{display:block!important;width:100%!important;max-width:100%!important;border:0!important;background:var(--bg)!important}
.pdf-page{position:relative;margin:0 auto;background:white;box-shadow:0 3px 12px #0002;line-height:0;flex-shrink:0;overflow:hidden}
.pdf-page canvas{display:block;max-width:none}
:root[data-theme="night"] .pdf-page canvas{filter:invert(.9) hue-rotate(180deg)}
:root[data-theme="ebook"] .pdf-page{background:#f4ecd8!important}
:root[data-theme="ebook"] .pdf-page canvas{filter:sepia(.75) saturate(.75) brightness(.88) contrast(.95)}
.pdf-page canvas{position:absolute;left:0;top:0;z-index:0;display:block;max-width:none;pointer-events:none}
.pdf-highlight-layer{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.pdf-highlight-rect{position:absolute;border-radius:2px;opacity:.48;pointer-events:none;mix-blend-mode:multiply}
.textLayer{position:absolute;left:0;top:0;right:0;bottom:0;z-index:3;overflow:hidden;opacity:1;line-height:1;text-align:initial;transform-origin:0 0;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;pointer-events:auto}
.textLayer span,.textLayer br{position:absolute;white-space:pre;color:transparent;transform-origin:0% 0%;cursor:text;user-select:text;-webkit-user-select:text}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(255,190,40,.45);color:transparent}
.reader-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line)}
#selectionMenu{display:none;position:fixed;z-index:99;gap:4px;padding:6px;background:#20242b;color:#fff;border-radius:10px;box-shadow:0 6px 24px #0004;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
#selectionMenu .selection-drag-handle{display:flex;align-items:center;justify-content:center;min-width:28px;min-height:32px;padding:4px 7px;border-radius:7px;background:#3b424d;color:#fff;cursor:move;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#selectionMenu.dragging .selection-drag-handle{cursor:grabbing}
#selectionMenu button{font-size:12px;padding:7px 8px;background:transparent;white-space:nowrap}
#selectionMenu #highlightSelection{background:#ffeb3b;color:#111}
#selectionMenu select{font-size:12px;max-width:94px;padding:7px 4px;border:1px solid #626b78;border-radius:7px;background:#303640;color:#fff}
@media(max-width:420px){#selectionMenu{gap:3px;padding:5px}#selectionMenu button{font-size:11px;padding:8px 6px}#selectionMenu .selection-drag-handle{min-width:30px}}
.note{padding:12px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}.note-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.note p{white-space:pre-wrap;margin:8px 0}.small{font-size:12px}
#status{padding:8px 12px;font-size:13px;color:var(--muted);display:none;background:var(--card)}
.dialog-backdrop{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:120}.dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,100%);max-height:85dvh;overflow:auto}.dialog textarea{width:100%;min-height:110px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(min-width:760px){.section{padding:22px}.reader-tools{padding:10px 14px}}
</style>
</head>
<body>
<div class="app">
<header><h1 id="appTitle">📚 Biblioteca</h1><nav class="nav"><button id="navLibrary" class="secondary">Libros</button><button id="navNotes" class="secondary">Notas</button></nav></header>
<div id="status" role="status"></div>
<main>
<section id="librarySection" class="section active">
<div class="toolbar"><input id="searchBooks" type="search" placeholder="Buscar un libro…" aria-label="Buscar libros"><button id="reloadBooks" class="secondary">Actualizar</button></div>
<div id="bookList" class="grid"><p class="empty">Conectando con la biblioteca…</p></div>
</section>
<section id="readerSection" class="section">
<div class="reader-tools">
<button id="backLibrary" class="secondary">← Biblioteca</button><strong id="readerTitle">Lector</strong>
<select id="themeSelect" aria-label="Tema"><option value="day">Día</option><option value="night">Noche</option><option value="ebook">E-book</option></select>
<button id="zoomOut" class="secondary" aria-label="Reducir zoom">−</button><span id="zoomLabel" class="small">100%</span><button id="zoomIn" class="secondary" aria-label="Ampliar zoom">+</button><button id="anchorPosition" class="secondary" aria-label="Anclar posición de lectura">⚓ Anclar</button>
</div>
<div id="viewerContainer"><div id="viewer"></div></div>
<div class="reader-bottom"><button id="prevPage" class="secondary">Anterior</button><span id="progress" class="muted">Preparando…</span><button id="nextPage">Siguiente</button></div>
</section>
<section id="notesSection" class="section">
<h2>Notas, resaltados y traducciones</h2><p class="muted">Las anotaciones se guardan en este dispositivo. La sincronización entre dispositivos requiere activar el esquema de Supabase y configurar la autenticación.</p>
<div class="toolbar"><input id="searchNotes" type="search" placeholder="Buscar en tus notas…" aria-label="Buscar notas"><button id="exportNotes" class="secondary">Exportar JSON</button></div>
<div id="notesList"></div>
</section>
</main>
</div>
<div id="selectionMenu" aria-label="Acciones del texto seleccionado">
  <button id="selectionDragHandle" class="selection-drag-handle" type="button" aria-label="Mover menú flotante" title="Mantén pulsado para mover">⠿</button>
  <select id="highlightColor" aria-label="Color del resaltado" title="Color del resaltado">
    <option value="#ffeb3b">Amarillo</option>
    <option value="#8ee6a8">Verde</option>
    <option value="#8ecbff">Azul</option>
    <option value="#ff9ecb">Rosa</option>
    <option value="#ffc078">Naranja</option>
    <option value="#c7a6ff">Violeta</option>
  </select>
  <button id="highlightSelection" type="button">Resaltar</button>
  <button id="translateSelection" type="button">Traducir</button>
  <button id="noteSelection" type="button">Añadir nota</button>
  <button id="closeSelection" type="button" aria-label="Cerrar menú">✕</button>
</div>
<div id="dialogBackdrop" class="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">Anotación</h2><p id="dialogOriginal" class="muted"></p><textarea id="dialogText" placeholder="Escribe una nota…"></textarea><div class="dialog-actions"><button id="dialogCancel" class="secondary">Cancelar</button><button id="dialogSave">Guardar</button></div></div></div>
<script>
(() => {
'use strict';
const tg = window.Telegram?.WebApp;
try { tg?.ready(); tg?.expand(); } catch (_) {}

const CONFIG = {
  supabaseUrl: 'https://augjyfnnzserfdoekkrp.supabase.co',
  // La clave publishable/anon puede estar en el cliente, pero NUNCA pongas aquí una service_role key.
  supabaseAnonKey: 'sb_publishable_ed7WzU7SyteyxrAk5qE44w_N2vslpMU',
  // Despliega la Edge Function incluida en este paquete y coloca su URL aquí.
  translateEndpoint: ''
};
const $ = id => document.getElementById(id);
const state = {
  supabase: null, books: [], currentBook: null, format: null, book: null, rendition: null,
  pdf: null, page: 1, scale: 1, selectedText: '', selectedAnchor: null, notes: [],
  loadToken: 0, pendingAction: null, epubHighlights: [], locationsReady: false
};
const NOTES_KEY = 'reader_pro_notes_v1';
const THEME_KEY = 'reader_pro_theme';
const PROGRESS_PREFIX = 'reader_pro_progress_';
const ANCHOR_PREFIX = 'reader_pro_anchor_';
const status = (message, show=true) => { $('status').textContent = message; $('status').style.display = show ? 'block' : 'none'; };
function escapeText(value) { return String(value ?? ''); }
function saveNotes() { try { localStorage.setItem(NOTES_KEY, JSON.stringify(state.notes)); } catch(e) { status('No se pudieron guardar las notas: almacenamiento lleno o bloqueado.'); } }
function loadNotes() { try { const n = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); state.notes = Array.isArray(n) ? n : []; } catch(_) { state.notes = []; } }
function makeId() { return (crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`); }
function setSection(which) {
  ['librarySection','readerSection','notesSection'].forEach(id => $(id).classList.remove('active'));
  $(which).classList.add('active');
  $('appTitle').textContent = which === 'librarySection' ? '📚 Biblioteca' : which === 'readerSection' ? '📖 Lector' : '📝 Mis anotaciones';
  hideSelectionMenu();
  if (which === 'notesSection') renderNotes();
}
function getBookId(book) { return String(book.id ?? book.url_archivo ?? book.titulo ?? 'unknown'); }
function fileFormat(book) {
  const f = String(book.formato || book.format || book.tipo_archivo || book.mime_type || book.content_type || '').trim().toLowerCase();
  if (f.includes('pdf') || f === 'application/pdf') return 'pdf';
  if (f.includes('epub')) return 'epub';
  const url = String(book.url_archivo || book.url || '');
  if (/\.pdf(?:$|[?#])/i.test(url)) return 'pdf';
  if (/\.epub(?:$|[?#])/i.test(url)) return 'epub';
  return '';
}
function safeUrl(url) {
  try { const u = new URL(url, location.href); return ['https:','http:'].includes(u.protocol) ? u.href : ''; } catch(_) { return ''; }
}
function addBookCard(book) {
  const card = document.createElement('button'); card.className = 'book secondary'; card.type = 'button';
  const cover = document.createElement('div'); cover.className = 'cover'; cover.textContent = '📖';
  const title = document.createElement('h3'); title.textContent = book.titulo || 'Sin título';
  const format = document.createElement('p'); format.className = 'muted'; format.textContent = fileFormat(book).toUpperCase() || 'Formato no indicado';
  card.append(cover,title,format); card.addEventListener('click', () => openBook(book)); $('bookList').append(card);
}
async function loadBooks() {
  const list = $('bookList'); list.replaceChildren(); const p = document.createElement('p'); p.className='empty'; p.textContent='Cargando biblioteca…'; list.append(p);
  if (!state.supabase) { p.textContent='No se pudo inicializar Supabase. Revisa la configuración.'; return; }
  try {
    const {data,error} = await state.supabase.from('libros').select('*').order('titulo', {ascending:true});
    if (error) throw error;
    state.books = Array.isArray(data) ? data : [];
    renderBooks();
    status(state.books.length ? `${state.books.length} libro(s) cargados.` : 'La tabla libros está vacía.', true);
    if (!state.books.length) list.innerHTML = '<p class="empty">Todavía no hay libros en la tabla <code>libros</code>.</p>';
  } catch(e) {
    list.replaceChildren(); const err=document.createElement('p'); err.className='empty'; err.textContent=`Error al cargar la biblioteca: ${e.message || 'error desconocido'}`; list.append(err);
  }
}
function renderBooks() {
  const list=$('bookList'); list.replaceChildren();
  const q=$('searchBooks').value.trim().toLocaleLowerCase();
  const filtered=state.books.filter(b=>String(b.titulo||'').toLocaleLowerCase().includes(q));
  if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent='No hay libros que coincidan con la búsqueda.';list.append(p);return;}
  filtered.forEach(addBookCard);
}
function setTheme(theme) {
  const allowed=['day','night','ebook']; if(!allowed.includes(theme)) theme='day';
  document.documentElement.dataset.theme = theme==='day' ? 'day' : theme;
  $('themeSelect').value=theme;
  try { localStorage.setItem(THEME_KEY,theme); } catch(_) {}
  applyEpubTheme();
}
function applyEpubTheme() {
  const theme=document.documentElement.dataset.theme || 'day';
  const palette=theme==='night'
    ? {bg:'#121418',fg:'#e9edf3',link:'#83bfff'}
    : theme==='ebook'
      ? {bg:'#f4ecd8',fg:'#2c221e',link:'#7b4d22'}
      : {bg:'#ffffff',fg:'#20242b',link:'#1769aa'};

  if(state.rendition) {
    try {
      // Definir el tema de epub.js y forzarlo también dentro de cada iframe.
      state.rendition.themes.default({
        'html': {'background': `${palette.bg} !important`, 'color': `${palette.fg} !important`},
        'body': {'background': `${palette.bg} !important`, 'color': `${palette.fg} !important`},
        'p, div, span, li, h1, h2, h3, h4, h5, h6, blockquote, section, article': {'color': `${palette.fg} !important`},
        'a': {'color': `${palette.link} !important`},
      });

      const contents=state.rendition.getContents ? state.rendition.getContents() : [];
      contents.forEach(content=>{
        const doc=content.document;
        if(!doc) return;
        let style=doc.getElementById('lector-pro-theme-overrides');
        if(!style) {
          style=doc.createElement('style');
          style.id='lector-pro-theme-overrides';
          (doc.head || doc.documentElement).appendChild(style);
        }
        style.textContent=`
          *, *::before, *::after { box-sizing: border-box !important; }
          /* No anular la altura ni las columnas que calcula epub.js: eso hacía
             que la página del libro fuese más ancha/alta que el visor móvil. */
          html, body {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            background: ${palette.bg} !important;
            background-color: ${palette.bg} !important;
            color: ${palette.fg} !important;
            color-scheme: ${theme==='night'?'dark':'light'} !important;
          }
          body {
            padding: 8px 10px !important;
            /* No fijar font-size aquí: epub.js controla el zoom del EPUB. */
            line-height: 1.55 !important;
            overflow-wrap: anywhere !important;
            word-wrap: break-word !important;
            hyphens: auto;
          }
          body, body *:not(img):not(svg):not(path):not(canvas) {
            color: ${palette.fg} !important;
          }
          p, div, section, article, blockquote, li, h1, h2, h3, h4, h5, h6 {
            max-width: 100% !important;
            overflow-wrap: break-word !important;
          }
          img, svg, video, canvas, table, pre, iframe { max-width: 100% !important; }
          img, video, canvas, svg { height: auto !important; }
          table { width: auto !important; max-width: 100% !important; table-layout: auto !important; }
          pre, code { white-space: pre-wrap !important; overflow-wrap: anywhere !important; }
          a, a * { color: ${palette.link} !important; }
        `;
        doc.documentElement.style.setProperty('background',palette.bg,'important');
        doc.documentElement.style.setProperty('color',palette.fg,'important');
        if(doc.body){
          doc.body.style.setProperty('background',palette.bg,'important');
          doc.body.style.setProperty('background-color',palette.bg,'important');
          doc.body.style.setProperty('color',palette.fg,'important');
        }
        const frame=doc.defaultView?.frameElement;
        if(frame) frame.style.backgroundColor=palette.bg;
      });
    } catch(e) { console.warn('No se pudieron aplicar los estilos al EPUB',e); }
  }

  // El PDF se dibuja en un canvas; el filtro cambia la apariencia de la hoja.
  document.querySelectorAll('.pdf-page canvas').forEach(canvas=>{
    canvas.style.filter=theme==='night'
      ? 'invert(.9) hue-rotate(180deg)'
      : theme==='ebook'
        ? 'sepia(.75) saturate(.75) brightness(.88) contrast(.95)'
        : '';
  });
  document.querySelectorAll('.pdf-page').forEach(page=>{
    page.style.backgroundColor=theme==='ebook'?'#f4ecd8':theme==='night'?'#121418':'#ffffff';
  });
}
function showReader(book) {
  setSection('readerSection'); $('readerTitle').textContent=book.titulo || 'Libro'; $('progress').textContent='Cargando…';
}
async function closeCurrentDocument() {
  state.loadToken++;
  try { state.rendition?.destroy(); } catch(_) {}
  state.rendition=null;
  try { state.book?.destroy(); } catch(_) {}
  state.book=null;
  try { await state.pdf?.destroy(); } catch(_) {}
  state.pdf=null; state.currentBook=null; state.format=null; state.selectedAnchor=null; state.selectedText='';
  $('viewer').replaceChildren(); hideSelectionMenu();
}
async function openBook(book) {
  const url=safeUrl(book.url_archivo);
  const format=fileFormat(book);
  if(!url){alert('Este libro no tiene una URL válida.');return;}
  if(!format){alert('No puedo identificar el formato del libro. En Supabase, revisa que la columna formato contenga pdf o epub. La URL también debe apuntar al archivo correcto.');return;}
  await closeCurrentDocument();
  const token=state.loadToken; state.currentBook=book; state.format=format; state.scale=1;
  $('zoomLabel').textContent='100%'; showReader(book); $('viewer').replaceChildren();
  try {
    if(format==='epub') await loadEpub(url,token);
    else await loadPdf(url,token);
  } catch(e) {
    if(token!==state.loadToken)return;
    console.error(e); $('viewer').replaceChildren();
    const p=document.createElement('p');p.className='empty';p.textContent=`No se pudo abrir el documento: ${e.message || 'comprueba el archivo, CORS y la URL.'}`;$('viewer').append(p);
    $('progress').textContent='Error de carga';
  }
}
async function loadEpub(url,token) {
  if(typeof ePub!=='function') throw new Error('La biblioteca EPUB no se ha cargado. Comprueba la conexión y recarga la aplicación.');
  if(typeof window.JSZip==='undefined' && typeof JSZip==='undefined') throw new Error('No se ha cargado JSZip. Recarga la app; si continúa, revisa que la CDN jsdelivr.net o cdnjs.cloudflare.com no esté bloqueada.');
  // Descargar el EPUB como bytes evita algunos fallos del cargador interno de epub.js
  // con URLs de almacenamiento. El servidor debe permitir CORS desde el dominio Vercel.
  let response;
  try { response=await fetch(url,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store'}); }
  catch(err) { throw new Error(`No se pudo descargar el EPUB: ${err.message||'error de red'}. Revisa que la URL sea pública y que Supabase permita CORS desde Vercel.`); }
  if(!response.ok) throw new Error(`Supabase respondió HTTP ${response.status} al descargar el EPUB. Revisa url_archivo y los permisos del bucket.`);
  const bytes=await response.arrayBuffer();
  if(token!==state.loadToken)return;
  if(bytes.byteLength<4) throw new Error('El archivo EPUB está vacío o incompleto.');
  // Los EPUB son archivos ZIP y normalmente empiezan con PK.
  const sig=new Uint8Array(bytes.slice(0,2));
  if(sig[0]!==0x50 || sig[1]!==0x4b) throw new Error('El archivo descargado no parece ser un EPUB válido (ZIP). Revisa que url_archivo apunte al .epub y no a una página web.');
  // Valida que el archivo sea un ZIP EPUB real antes de pasarlo a epub.js.
  try {
    const zipCheck = await JSZip.loadAsync(bytes.slice(0));
    if (!zipCheck.file('META-INF/container.xml')) throw new Error('Falta META-INF/container.xml.');
  } catch (zipError) {
    throw new Error(`El archivo descargado no es un EPUB válido o está dañado: ${zipError.message || 'no se pudo leer el ZIP'}`);
  }
  if(token!==state.loadToken)return;

async function loadPdf(url,token) {
  if(!window.pdfjsLib) throw new Error('PDF.js no se ha cargado. Comprueba tu conexión y vuelve a desplegar.');

  let firstError;
  try {
    state.pdf=await pdfjsLib.getDocument({url,withCredentials:false}).promise;
  } catch(err) {
    firstError=err;
    // Segundo intento: descargar los bytes y entregárselos a PDF.js.
    // Requiere que el objeto exista y que Supabase permita CORS para el dominio de la app.
    try {
      const response=await fetch(url,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store'});

      if(bytes.byteLength<5) throw new Error('El archivo descargado está vacío o incompleto.');

      if(signature!=='%PDF-') throw new Error('El archivo de Supabase no parece ser un PDF válido. Revisa la URL y el archivo guardado.');
      state.pdf=await pdfjsLib.getDocument({data:new Uint8Array(bytes)}).promise;
    } catch(secondError) {
      const detail=secondError?.message || firstError?.message || 'error desconocido';
      throw new Error(`No se pudo cargar el PDF. ${detail} Si aparece un error CORS, revisa los permisos del bucket Libros-bucket en Supabase. Si la URL da 404, corrige url_archivo. (PDF.js: ${firstError?.message || 'sin detalle'})`);

  }
  if(token!==state.loadToken)return;
  if(!state.pdf || !state.pdf.numPages) throw new Error('El archivo no contiene páginas PDF legibles.');

async function renderPdfPage(num,token=state.loadToken) {

function restorePdfHighlights(pageNumber=state.page){
  if(!state.currentBook||state.format!=='pdf')return;
  const wrapper=$('viewer').querySelector('.pdf-page');
  const layer=wrapper?.querySelector('.pdf-highlight-layer');
  if(!wrapper||!layer)return;
  layer.replaceChildren();
  const bookId=getBookId(state.currentBook);
  state.notes.filter(n=>n.bookId===bookId&&n.type==='Resaltado'&&n.anchor?.kind==='pdf'&&Number(n.anchor.page)===Number(pageNumber)&&Array.isArray(n.anchor.rects)).forEach(note=>{
    const color=safeHighlightColor(note.color);
    note.anchor.rects.forEach(r=>{
      if(!r||![r.x,r.y,r.w,r.h].every(Number.isFinite))return;
      const mark=document.createElement('div');
      mark.className='pdf-highlight-rect';
      mark.style.backgroundColor=color;
      mark.style.left=`${r.x*100}%`;
      mark.style.top=`${r.y*100}%`;
      mark.style.width=`${Math.max(0,r.w*100)}%`;
      mark.style.height=`${Math.max(0,r.h*100)}%`;

function safeHighlightColor(color){

function getPdfSelectionAnchor(range,text){
  const wrapper=$('viewer').querySelector('.pdf-page');
  const textLayer=wrapper?.querySelector('.textLayer');
  if(!wrapper||!textLayer||!range)return{kind:'pdf',page:state.page,quote:text,rects:[]};
  const startNode=range.startContainer,endNode=range.endContainer;
  const inside=node=>textLayer.contains(node)||(node?.parentElement&&textLayer.contains(node.parentElement));
  if(!inside(startNode)||!inside(endNode))return{kind:'pdf',page:state.page,quote:text,rects:[]};
  const bounds=wrapper.getBoundingClientRect();
  if(!bounds.width||!bounds.height)return{kind:'pdf',page:state.page,quote:text,rects:[]};
  const rects=[];
  for(const r of Array.from(range.getClientRects())){
    if(!r.width||!r.height)continue;
    const left=Math.max(r.left,bounds.left),top=Math.max(r.top,bounds.top);
    const right=Math.min(r.right,bounds.right),bottom=Math.min(r.bottom,bounds.bottom);
    if(right<=left||bottom<=top)continue;
    rects.push({x:(left-bounds.left)/bounds.width,y:(top-bounds.top)/bounds.height,w:(right-left)/bounds.width,h:(bottom-top)/bounds.height});
  }
  return{kind:'pdf',page:state.page,quote:text,rects};
}

(function enableFloatingMenuDrag(){
  const menu=$('selectionMenu'), handle=$('selectionDragHandle');

  handle.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;

    try{handle.setPointerCapture(e.pointerId);}catch(_){}

    if(menuDrag.moved){
      const rect=menu.getBoundingClientRect();

    }

  };

  handle.addEventListener('pointercancel',endDrag);

async function applyReaderZoom(){

    if(anchorCfi) await rendition.display(anchorCfi);

      if(!anchorCfi)container.scrollTop=oldScrollTop;

      const cfi=loc?.start?.cfi || anchorCfi;
      if(cfi && state.currentBook){
        try{localStorage.setItem(PROGRESS_PREFIX+getBookId(state.currentBook),cfi);}catch(_){}

  });
}
$('exportNotes').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state.notes,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mis-anotaciones.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
window.addEventListener('resize',()=>{
  clearTimeout(window.__readerResizeTimer);
  window.__readerResizeTimer=setTimeout(()=>{
    if(state.format==='pdf'&&state.pdf){renderPdfPage(state.page);return;}
    if(state.format==='epub'&&state.rendition){
      const box=$('viewerContainer');
      const width=Math.max(1,box.clientWidth);
      const height=Math.max(1,box.clientHeight);
      try{state.rendition.resize(width,height);applyEpubTheme();}catch(e){console.warn('No se pudo reajustar el EPUB al tamaño de la app',e);}
    }
  },180);
});
window.addEventListener('beforeunload',()=>{try{state.rendition?.destroy();state.pdf?.destroy();}catch(_){}});
loadNotes();
try { setTheme(localStorage.getItem(THEME_KEY)||'day'); } catch(_) {setTheme('day');}
try {
  if(window.supabase?.createClient && CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) {
    state.supabase=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);
  }
} catch(e) { console.error(e); }
loadBooks();
})();
</script>
</body>
</html>
