<title>Lector Pro · Telegram</title>

<style>

:root[data-theme="ebook"]{--bg:#f4ecd8;--fg:#2c221e;--card:#e8dec5;--line:#d4c8aa;--muted:#6b5b4c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
button,select,input,textarea{font:inherit}
button{border:0;border-radius:10px;background:var(--accent);color:white;padding:10px 12px;cursor:pointer}
button:disabled{opacity:.4}
button.secondary{background:var(--card);color:var(--fg);border:1px solid var(--line)}
button.danger{background:#b42318;color:white}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}

.nav{display:flex;gap:6px}
.nav button{padding:8px 10px}
main{flex:1;min-height:0;position:relative}
.section{display:none;height:100%;overflow:auto;padding:14px}
.section.active{display:block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:150px;cursor:pointer;overflow-wrap:anywhere;text-align:left;color:var(--fg)}
.cover{font-size:42px;display:grid;place-items:center;height:75px}
.book h3{font-size:14px;margin:8px 0 4px}
.muted{color:var(--muted);font-size:13px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);overflow-wrap:anywhere}
#readerSection{padding:0;display:none;flex-direction:column;overflow:hidden}
#readerSection.active{display:flex}
.reader-tools{padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
.reader-tools select{max-width:115px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
#readerTitle{font-size:13px;max-width:35vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewerContainer{position:relative;flex:1;min-height:0;height:100%;overflow:auto;background:var(--bg);overscroll-behavior:contain}
#viewer{position:relative;width:100%;height:100%;min-height:100%;display:block;background:var(--bg)}

#viewer .epub-view{background:var(--bg)}
#viewer iframe{border:0;max-width:100%}
.pdf-page{position:relative;margin:10px auto;background:white;box-shadow:0 3px 12px #0002;line-height:0}
.pdf-page canvas{display:block;max-width:none}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;user-select:text;-webkit-user-select:text;pointer-events:auto}
.textLayer span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;cursor:text}
.textLayer ::selection{background:rgba(36,129,204,.45)}
.reader-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line)}
#status{padding:8px 12px;font-size:13px;color:var(--muted);display:none;background:var(--card);overflow-wrap:anywhere}
#selectionMenu{display:none;position:fixed;z-index:99;gap:4px;padding:6px;background:#20242b;color:white;border-radius:10px;box-shadow:0 6px 24px #0004;max-width:calc(100vw - 12px);max-height:45dvh;overflow:auto;flex-wrap:wrap;touch-action:pan-y}
#selectionMenu button{font-size:12px;padding:8px;background:#303640;color:white;white-space:nowrap}
#selectionMenu #highlightSelection{background:#ffeb3b;color:#111}
#selectionMenu select{font-size:12px;max-width:90px;padding:7px;border:1px solid #626b78;border-radius:7px;background:#303640;color:white}
.note{padding:12px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.note-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.note p{white-space:pre-wrap;margin:8px 0}
.small{font-size:12px}
.dialog-backdrop{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:120}
.dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,100%);max-height:85dvh;overflow:auto}
.dialog textarea{width:100%;min-height:110px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(min-width:760px){.section{padding:22px}.reader-tools{padding:10px 14px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1 id="appTitle">📚 Biblioteca</h1>
<nav class="nav">
<button id="navLibrary" class="secondary">Libros</button>
<button id="navNotes" class="secondary">Notas</button>
</nav>
</header>

<button id="reloadBooks" class="secondary">Actualizar</button>
</div>
<div id="bookList" class="grid"><p class="empty">Conectando con la biblioteca…</p></div>
</section>
<section id="readerSection" class="section">
<div class="reader-tools">
<button id="backLibrary" class="secondary">← Biblioteca</button>
<strong id="readerTitle">Lector</strong>
<select id="themeSelect" aria-label="Tema">

</select>
<button id="zoomOut" class="secondary">−</button>

<button id="zoomIn" class="secondary">+</button>
</div>
<div id="viewerContainer"><div id="viewer"></div></div>
<div class="reader-bottom">
<button id="prevPage" class="secondary">Anterior</button>
<span id="progress" class="muted">Preparando…</span>
<button id="nextPage">Siguiente</button>
</div>
</section>
<section id="notesSection" class="section">
<h2>Notas y resaltados</h2>
<p class="muted">Las anotaciones se guardan en este dispositivo.</p>
<div class="toolbar">
<input id="searchNotes" type="search" placeholder="Buscar notas…">
<button id="exportNotes" class="secondary">Exportar JSON</button>
</div>
<div id="notesList"></div>
</section>
</main>
</div>
<div id="selectionMenu">
<select id="highlightColor" aria-label="Color del resaltado">
<option value="#ffeb3b">Amarillo</option><option value="#8ee6a8">Verde</option><option value="#8ecbff">Azul</option><option value="#ff9ecb">Rosa</option><option value="#ffc078">Naranja</option><option value="#c7a6ff">Violeta</option>
</select>
<button id="highlightSelection">Resaltar</button>
<button id="noteSelection">Añadir nota</button>
<button id="closeSelection">✕</button>
</div>
<div id="dialogBackdrop" class="dialog-backdrop">
<div class="dialog" role="dialog" aria-modal="true">
<h2 id="dialogTitle">Anotación</h2><p id="dialogOriginal" class="muted"></p>
<textarea id="dialogText" placeholder="Escribe una nota…"></textarea>
<div class="dialog-actions"><button id="dialogCancel" class="secondary">Cancelar</button><button id="dialogSave">Guardar</button></div>
</div>
</div>

async function renderPdfPage(num,token=state.loadToken){if(!state.pdf)return;num=Math.max(1,Math.min(state.pdf.numPages,Math.floor(num)));state.page=num;$('prevPage').disabled=num<=1;$('nextPage').disabled=num>=state.pdf.numPages;$('progress').textContent=`Página ${num} de ${state.pdf.numPages}`;const page=await state.pdf.getPage(num);if(token!==state.loadToken)return;const container=$('viewer');container.replaceChildren();const base=page.getViewport({scale:1}),available=Math.max(260,$('viewerContainer').clientWidth-20),scale=Math.min(1.5,available/base.width)*state.scale,viewport=page.getViewport({scale}),wrapper=document.createElement('div');wrapper.className='pdf-page';wrapper.style.width=`${viewport.width}px`;wrapper.style.height=`${viewport.height}px`;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false}),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=`${viewport.width}px`;canvas.style.height=`${viewport.height}px`;const layer=document.createElement('div');layer.className='textLayer';layer.style.width=`${viewport.width}px`;layer.style.height=`${viewport.height}px`;wrapper.append(canvas,layer);container.append(wrapper);await page.render({canvasContext:ctx,viewport,transform:dpr===1?null:[dpr,0,0,dpr,0,0]}).promise;if(token!==state.loadToken)return;const textContent=await page.getTextContent();if(typeof pdfjsLib.renderTextLayer==='function'){const task=pdfjsLib.renderTextLayer({textContent,container:layer,viewport,textDivs:[]});if(task?.promise)await task.promise}try{localStorage.setItem(PROGRESS_PREFIX+getBookId(state.currentBook),String(num))}catch(_){}applyEpubTheme()}
function showSelectionMenu(x,y){const menu=$('selectionMenu');menu.style.display='flex';requestAnimationFrame(()=>{const w=menu.offsetWidth||280,h=menu.offsetHeight||50;menu.style.left=`${Math.max(6,Math.min(window.innerWidth-w-6,x))}px`;menu.style.top=`${Math.max(6,Math.min(window.innerHeight-h-6,y))}px`})}
function hideSelectionMenu(){$('selectionMenu').style.display='none'}
document.addEventListener('selectionchange',()=>{if(state.format!=='pdf')return;const sel=window.getSelection(),text=sel?.toString()?.trim();if(!text)return;const node=sel.anchorNode;if(!node||!$('viewer').contains(node))return;state.selectedText=text;const rect=sel.getRangeAt(0).getBoundingClientRect();state.selectedAnchor={kind:'pdf',page:state.page,quote:text};showSelectionMenu(rect.left,rect.bottom+8)});
function applyEpubHighlight(cfi,color){if(!state.rendition||!cfi)return false;const safe=/^#[0-9a-f]{6}$/i.test(String(color||''))?color:'#ffeb3b';try{state.rendition.annotations.highlight(cfi,{color:safe},()=>{},'reader-highlight',{fill:safe,'fill-opacity':'0.55','mix-blend-mode':'multiply','pointer-events':'all'});return true}catch(e){console.error('Error aplicando resaltado EPUB:',e);return false}}
function restoreEpubHighlights(){if(!state.rendition||!state.currentBook)return;const id=getBookId(state.currentBook);state.notes.filter(n=>n.bookId===id&&n.type==='Resaltado'&&n.anchor?.kind==='epub'&&n.anchor.cfi).forEach(n=>applyEpubHighlight(n.anchor.cfi,n.color||'#ffeb3b'))}
function createNote({type,text,original='',anchor=state.selectedAnchor,color=null}){state.notes.unshift({id:makeId(),bookId:getBookId(state.currentBook),bookTitle:state.currentBook?.titulo||'Libro',type,text,original,anchor,color,createdAt:new Date().toISOString()});saveNotes();hideSelectionMenu();renderNotes()}
$('highlightSelection').addEventListener('click',()=>{if(!state.selectedText||!state.currentBook){alert('Selecciona primero una palabra o un fragmento del libro.');return}const anchor=state.selectedAnchor?{...state.selectedAnchor}:{kind:state.format},color=$('highlightColor').value;if(state.format==='epub'){if(!anchor.cfi){alert('No se pudo identificar el fragmento. Selecciona el texto de nuevo.');return}if(!applyEpubHighlight(anchor.cfi,color)){alert('No se pudo resaltar el texto. Prueba a seleccionar otra vez.');return}}createNote({type:'Resaltado',text:state.selectedText,anchor,color});try{(state.rendition?.getContents?.()||[]).forEach(c=>c.window?.getSelection?.().removeAllRanges())}catch(_){}try{window.getSelection()?.removeAllRanges()}catch(_){}});
$('noteSelection').addEventListener('click',()=>{if(!state.selectedText||!state.currentBook){alert('Selecciona primero un fragmento de texto.');return}const selected=state.selectedText;openDialog('Nota',selected,'',value=>createNote({type:'Nota',text:value,original:selected}))});
function openDialog(title,original,value,onSave){state.pendingAction=onSave;$('dialogTitle').textContent=title;$('dialogOriginal').textContent=original||'';$('dialogText').value=value||'';$('dialogBackdrop').style.display='flex';$('dialogText').focus()}
function closeDialog(){$('dialogBackdrop').style.display='none';state.pendingAction=null}
$('dialogCancel').addEventListener('click',closeDialog);
$('dialogBackdrop').addEventListener('click',e=>{if(e.target===$('dialogBackdrop'))closeDialog()});
$('dialogSave').addEventListener('click',()=>{const cb=state.pendingAction,value=$('dialogText').value.trim();if(!value){$('dialogText').focus();return}closeDialog();if(cb)cb(value)});
$('closeSelection').addEventListener('click',hideSelectionMenu);
document.addEventListener('pointerdown',e=>{if(!$('selectionMenu').contains(e.target)&&!window.getSelection()?.toString()?.trim()&&!state.selectedText)hideSelectionMenu()});
$('prevPage').addEventListener('click',async()=>{hideSelectionMenu();try{if(state.format==='epub'&&state.rendition)await state.rendition.prev();else if(state.format==='pdf'&&state.pdf&&state.page>1)await renderPdfPage(state.page-1)}catch(e){status(`No se pudo ir a la página anterior: ${e.message||e}`)}});
$('nextPage').addEventListener('click',async()=>{hideSelectionMenu();try{if(state.format==='epub'&&state.rendition)await state.rendition.next();else if(state.format==='pdf'&&state.pdf&&state.page<state.pdf.numPages)await renderPdfPage(state.page+1)}catch(e){status(`No se pudo avanzar: ${e.message||e}`)}});
$('zoomIn').addEventListener('click',async()=>{state.scale=Math.min(3,Math.round((state.scale+.2)*10)/10);$('zoomLabel').textContent=`${Math.round(state.scale*100)}%`;if(state.format==='pdf')await renderPdfPage(state.page);else if(state.rendition)state.rendition.themes.fontSize(`${Math.round(state.scale*100)}%`)});
$('zoomOut').addEventListener('click',async()=>{state.scale=Math.max(.6,Math.round((state.scale-.2)*10)/10);$('zoomLabel').textContent=`${Math.round(state.scale*100)}%`;if(state.format==='pdf')await renderPdfPage(state.page);else if(state.rendition)state.rendition.themes.fontSize(`${Math.round(state.scale*100)}%`)});
$('themeSelect').addEventListener('change',e=>setTheme(e.target.value));
$('navLibrary').addEventListener('click',()=>setSection('librarySection'));
$('navNotes').addEventListener('click',()=>setSection('notesSection'));
$('backLibrary').addEventListener('click',async()=>{await closeCurrentDocument();setSection('librarySection')});
$('reloadBooks').addEventListener('click',loadBooks);
$('searchBooks').addEventListener('input',renderBooks);
$('searchNotes').addEventListener('input',renderNotes);
function renderNotes(){const list=$('notesList');list.replaceChildren();const q=$('searchNotes').value.trim().toLocaleLowerCase(),items=state.notes.filter(n=>[n.bookTitle,n.type,n.text,n.original].join(' ').toLocaleLowerCase().includes(q));if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='Todavía no hay anotaciones.';list.append(p);return}items.forEach(n=>{const article=document.createElement('article');article.className='note';const head=document.createElement('div');head.className='note-head';const label=document.createElement('strong');label.textContent=`${n.type} · ${n.bookTitle||'Libro'}`;const del=document.createElement('button');del.className='danger';del.textContent='Eliminar';del.addEventListener('click',()=>{if(!confirm('¿Eliminar esta anotación?'))return;state.notes=state.notes.filter(x=>x.id!==n.id);saveNotes();renderNotes()});head.append(label,del);const date=document.createElement('div');date.className='muted small';date.textContent=new Date(n.createdAt).toLocaleString();article.append(head,date);if(n.original){const orig=document.createElement('p');orig.textContent=`Texto original: ${n.original}`;article.append(orig)}const text=document.createElement('p');text.textContent=n.text;if(n.color)text.style.borderLeft=`5px solid ${n.color}`;article.append(text);list.append(article)})}
$('exportNotes').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state.notes,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mis-anotaciones.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
window.addEventListener('resize',()=>{if(state.format==='epub'){clearTimeout(window.__epubResizeTimer);window.__epubResizeTimer=setTimeout(resizeEpub,150)}if(state.format==='pdf'&&state.pdf){clearTimeout(window.__pdfResizeTimer);window.__pdfResizeTimer=setTimeout(()=>renderPdfPage(state.page),180)}});
window.addEventListener('beforeunload',()=>{try{state.rendition?.destroy();state.book?.destroy();state.pdf?.destroy()}catch(_){}});
loadNotes();
try{setTheme(localStorage.getItem(THEME_KEY)||'day')}catch(_){setTheme('day')}
try{if(window.supabase?.createClient)state.supabase=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey)}catch(e){console.error('Supabase:',e)}
loadBooks();
})();
</script>
