<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lector de EPUB - Telegram Mini App</title>
    
    <!-- SDK de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Librería ePub.js y JSZip (necesaria para ePub.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #viewer {
            flex: 1;
            width: 100%;
            height: calc(100vh - 100px);
        }

        #nav-controls {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            background-color: var(--bg-color);
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="header">
        <span id="book-title">Cargando libro...</span>
        <span id="progress">0%</span>
    </div>

    <div id="loading">Preparando tu lectura...</div>
    <div id="viewer"></div>

    <div id="nav-controls">
        <button id="prev-btn">Anterior</button>
        <button id="next-btn">Siguiente</button>
    </div>

    <script>
        // 1. Inicializar Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 2. Configuración de Supabase (Sustituye con tus credenciales reales)
        const SUPABASE_URL = 'TUS_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TUS_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let book = null;
        let rendition = null;

        async function initReader() {
            try {
                // Obtener el ID del libro pasado por Telegram (ej: ?startapp=libro_123)
                const startParam = tg.initDataUnsafe.start_param || 'default_book';
                
                // Consultar Supabase para obtener la URL del archivo EPUB
                const { data, error } = await supabaseClient
                    .from('libros')
                    .select('titulo, epub_url')
                    .eq('id', startParam)
                    .single();

                if (error || !data) {
                    throw new Error("No se pudo encontrar el libro en la base de datos.");
                }

                document.getElementById('book-title').innerText = data.titulo;

                // 3. Inicializar ePub.js con la URL obtenida de Supabase Storage o base de datos
                book = ePub(data.epub_url);
                rendition = book.renderTo("viewer", {
                    width: "100%",
                    height: "100%",
                    spread: "auto"
                });

                // Recuperar última posición guardada (si existe)
                const savedLocation = localStorage.getItem(`epub_pos_${startParam}`);
                
                await rendition.display(savedLocation || undefined);
                document.getElementById('loading').style.display = 'none';

                // Guardar progreso al cambiar de página
                rendition.on("relocated", (location) => {
                    const percent = book.locations.percentageFromCfi(location.start.cfi);
                    document.getElementById('progress').innerText = Math.round(percent * 100) + '%';
                    
                    // Guardar en localStorage de forma local
                    localStorage.setItem(`epub_pos_${startParam}`, location.start.cfi);
                });

                // Cargar ubicaciones para calcular el porcentaje de avance con precisión
                await book.locations.generate(1024);

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = "Error al cargar el libro. Inténtalo de nuevo.";
            }
        }

        // Controladores de navegación mediante botones
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (rendition) rendition.prev();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (rendition) rendition.next();
        });

        // Iniciar la aplicación al cargar la página
        window.addEventListener('load', initReader);
    </script>
</body>
</html>
