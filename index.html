<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lector Mini App - Telegram</title>
    <!-- SDK de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- ePub.js para lectura de libros EPUB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent-color: #2481cc;
            --card-bg: #f5f5f5;
        }
        body.modo-noche {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2d2d2d;
        }
        body.modo-evook {
            --bg-color: #f4ecd8;
            --text-color: #2c221e;
            --card-bg: #e5dcc3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: 12px 16px; background-color: var(--card-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .btn { background: var(--accent-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Secciones */
        .seccion { display: none; flex: 1; flex-direction: column; padding: 16px; overflow-y: auto; }
        .seccion.activa { display: flex; }

        /* Biblioteca */
        .grid-libros { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
        .libro-card { background: var(--card-bg); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }
        .libro-card h3 { font-size: 14px; margin-top: 8px; }

        /* Visor de lectura */
        #viewer-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        #viewer { flex: 1; width: 100%; height: 100%; }
        #viewer.zoom-activo { overflow: auto !important; touch-action: pan-x pan-y; }
        
        /* Controles de lectura inferiores */
        .reader-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--card-bg); font-size: 13px; }
        
        /* Panel de Notas */
        .nota-item { background: var(--card-bg); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid var(--accent-color); }
    </style>
</head>
<body>

    <header>
        <h2 id="titulo-app">Biblioteca</h2>
        <div>
            <button class="btn" onclick="cambiarSeccion('biblioteca')">Libros</button>
            <button class="btn" onclick="cambiarSeccion('notas')">Notas</button>
        </div>
    </header>

    <main>
        <!-- SECCIÓN 1: BIBLIOTECA -->
        <div id="seccion-biblioteca" class="seccion activa">
            <h2 style="margin-bottom: 16px;">Tus Libros</h2>
            <div id="lista-libros" class="grid-libros">
                <p>Cargando biblioteca desde Supabase...</p>
            </div>
        </div>

        <!-- SECCIÓN 2: LECTOR -->
        <div id="seccion-lector" class="seccion">
            <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                <button class="btn" onclick="setModoLectura('dia')">Día</button>
                <button class="btn" onclick="setModoLectura('noche')">Noche</button>
                <button class="btn" onclick="setModoLectura('evook')">E-book</button>
                <button class="btn" onclick="toggleZoom()" id="btn-zoom">Zoom: Off</button>
                <button class="btn" onclick="traducirTextoSeleccionado()">Traducir</button>
                <button class="btn" onclick="guardarNotaActual()">Guardar Nota</button>
            </div>
            
            <div id="viewer-container">
                <div id="viewer"></div>
            </div>

            <div class="reader-toolbar">
                <button class="btn" onclick="libroAnterior()">Anterior</button>
                <span id="progreso-lectura">0% (Pág. 0/0)</span>
                <button class="btn" onclick="libroSiguiente()">Siguiente</button>
            </div>
        </div>

        <!-- SECCIÓN 3: NOTAS Y TRADUCCIONES -->
        <div id="seccion-notas" class="seccion">
            <h2 style="margin-bottom: 16px;">Notas y Traducciones</h2>
            <div id="lista-notas">
                <p>No hay notas guardadas aún.</p>
            </div>
        </div>
    </main>

    <script>
        // Inicializar Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Configuración de Supabase
        const SUPABASE_URL = 'https://augjyfnnzserfdoekkrp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ed7WzU7SyteyxrAk5qE44w_N2vslpMU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let book = null;
        let rendition = null;
        let notasGuardadas = JSON.parse(localStorage.getItem('reader_notes') || '[]');
        let zoomActivo = false;

        // Navegación entre secciones
        function cambiarSeccion(seccion) {
            document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
            document.getElementById(`seccion-${seccion}`).classList.add('activa');
            document.getElementById('titulo-app').innerText = seccion === 'biblioteca' ? 'Biblioteca' : seccion === 'lector' ? 'Lector' : 'Notas y Traducciones';
            if (seccion === 'notas') renderizarNotas();
        }

        // Cargar biblioteca desde Supabase con manejo de errores detallado
        async function cargarBiblioteca() {
            const contenedor = document.getElementById('lista-libros');
            contenedor.innerHTML = '<p>Cargando biblioteca...</p>';

            const { data, error } = await supabaseClient.from('libros').select('*');
            
            if (error) {
                console.error("Error al consultar Supabase:", error);
                contenedor.innerHTML = `<p style="color: red;">Error al cargar: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                contenedor.innerHTML = '<p>La tabla de libros está vacía o no se encontraron registros.</p>';
                return;
            }

            contenedor.innerHTML = '';
            data.forEach(libro => {
                const card = document.createElement('div');
                card.className = 'libro-card';
                card.innerHTML = `
                    <div style="background:#ddd; height:120px; border-radius:4px; margin-bottom:8px; display:flex; align-items:center; justify-content:center;">📖</div>
                    <h3>${libro.titulo || 'Sin título'}</h3>
                `;
                card.onclick = () => abrirLibro(libro.url_archivo);
                contenedor.appendChild(card);
            });
        }

        // Abrir y renderizar EPUB
        function abrirLibro(url) {
            if (!url) {
                alert("Este libro no tiene una URL de archivo válida.");
                return;
            }
            cambiarSeccion('lector');
            document.getElementById('viewer').innerHTML = '';
            
            book = ePub(url);
            rendition = book.renderTo("viewer", {
                width: "100%",
                height: "100%"
            });

            let ultimaUbicacion = localStorage.getItem('last_loc_' + url);
            rendition.display(ultimaUbicacion || undefined);

            rendition.on("relocated", (location) => {
                const percent = book.locations.percentageFromCfi(location.start.cfi);
                if (!isNaN(percent)) {
                    document.getElementById('progreso-lectura').innerText = `${Math.round(percent * 100)}%`;
                    localStorage.setItem('last_loc_' + url, location.start.cfi);
                }
            });

            book.locations.generate(1024);
        }

        function libroSiguiente() { if (rendition) rendition.next(); }
        function libroAnterior() { if (rendition) rendition.prev(); }

        // Modos de lectura
        function setModoLectura(modo) {
            document.body.classList.remove('modo-noche', 'modo-evook');
            if (modo === 'noche') document.body.classList.add('modo-noche');
            if (modo === 'evook') document.body.classList.add('modo-evook');
        }

        // Zoom y movimiento libre
        function toggleZoom() {
            zoomActivo = !zoomActivo;
            const viewer = document.getElementById('viewer');
            const btn = document.getElementById('btn-zoom');
            if (zoomActivo) {
                viewer.classList.add('zoom-activo');
                btn.innerText = "Zoom: On (Movimiento libre)";
                if(rendition) rendition.themes.fontSize("150%");
            } else {
                viewer.classList.remove('zoom-activo');
                btn.innerText = "Zoom: Off";
                if(rendition) rendition.themes.fontSize("100%");
            }
        }

        // Traductor y Notas
        function traducirTextoSeleccionado() {
            const seleccion = window.getSelection().toString();
            if (!seleccion) {
                alert("Por favor, selecciona texto en la página primero.");
                return;
            }
            const traduccion = `[Traducido]: ${seleccion}`;
            notasGuardadas.push({ tipo: 'Traducción', texto: traduccion, fecha: new Date().toLocaleDateString() });
            localStorage.setItem('reader_notes', JSON.stringify(notasGuardadas));
            alert("Traducción guardada en el apartado de Notas.");
        }

        function guardarNotaActual() {
            const seleccion = window.getSelection().toString();
            if (!seleccion) {
                alert("Selecciona el párrafo que deseas guardar como nota.");
                return;
            }
            notasGuardadas.push({ tipo: 'Nota', texto: seleccion, fecha: new Date().toLocaleDateString() });
            localStorage.setItem('reader_notes', JSON.stringify(notasGuardadas));
            alert("Nota guardada correctamente.");
        }

        function renderizarNotas() {
            const contenedor = document.getElementById('lista-notas');
            if (notasGuardadas.length === 0) {
                contenedor.innerHTML = '<p>No hay notas guardadas aún.</p>';
                return;
            }
            contenedor.innerHTML = '';
            notasGuardadas.forEach((nota) => {
                const div = document.createElement('div');
                div.className = 'nota-item';
                div.innerHTML = `<strong>${nota.tipo} (${nota.fecha}):</strong><p>${nota.texto}</p>`;
                contenedor.appendChild(div);
            });
        }

        // Inicializar carga al iniciar
        window.onload = () => {
            cargarBiblioteca();
        };
    </script>
</body>
</html>
